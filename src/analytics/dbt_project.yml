name: 'health_metrics'
version: '1.0.0'

profile: 'health_metrics'

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

clean-targets:     
  - "target"
  - "dbt_packages"

models:
  health_metrics:
    +persist_docs:
      relation: true
      columns: true
    +submission_method: serverless
    +materialized: table
    # Dev tables have a two day lifecycle rule
    +hours_to_expiration: "{{ 48 if target.name == 'dev' else none }}"

    # Layer-specific overrides
    base:
      +schema: health_metrics_base
      +materialized: view
      +tags: ["base"]

    staging:
      +schema: health_metrics_staging
      +tags: ["staging"]
      "01":
        +tags: ["pre_gemini"]
      "02":
        +tags: ["post_gemini"]

    analytics:
      +schema: health_metrics_analytics
      +tags: ["analytics"]

    marts:
      +schema: health_metrics_marts
      +tags: ["marts"]
  
